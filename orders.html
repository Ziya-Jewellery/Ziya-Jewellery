<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Orders | Ziya Jewellery</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff6fb,#f1eaff);color:#29152e}header{background:linear-gradient(135deg,#8d1455,#5c1b9e);color:#fff;padding:17px 20px}.nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.logo{font-size:25px;font-weight:bold}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.navlinks a{color:#fff;text-decoration:none;padding:9px 12px;border-radius:18px;background:#ffffff1c;font-size:13px}.container{max-width:1000px;margin:30px auto;padding:0 18px}h1{color:#701650}.login-card,.order-card,.empty{background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 35px #5b245018;margin-bottom:20px}input{width:100%;padding:13px;border:1px solid #ddd2df;border-radius:10px;margin-top:8px;font-size:15px}button{border:0;padding:13px 18px;border-radius:10px;background:linear-gradient(135deg,#e72b7b,#7025ed);color:#fff;font-weight:bold;cursor:pointer;margin-top:12px}button:disabled{opacity:.6;cursor:not-allowed}.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #eee;padding-bottom:15px}.order-id{font-weight:bold;color:#721550}.status{padding:7px 12px;border-radius:20px;background:#f7e7ef;color:#721550;font-weight:bold;font-size:13px}.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.item img{width:70px;height:70px;object-fit:cover;border-radius:10px;background:#f6edf4}.item-info{flex:1}.item-name{font-weight:bold}.price{color:#a01762;font-weight:bold;margin-top:5px}.total{text-align:right;font-size:20px;font-weight:bold;color:#721550;margin-top:15px}.address{margin-top:15px;padding:14px;background:#faf5fa;border-radius:12px;font-size:14px;line-height:1.6}.buy-again{display:inline-block;margin-top:15px;padding:11px 15px;border-radius:10px;background:#f0e3f3;color:#701650;text-decoration:none;font-weight:bold}.empty{text-align:center;padding:55px 20px}.empty-icon{font-size:65px}.shop{display:inline-block;margin-top:15px;padding:12px 20px;border-radius:22px;background:#721550;color:#fff;text-decoration:none}.note{font-size:13px;color:#777;line-height:1.5}.tracking{margin-top:18px;padding:16px;background:#fff8fc;border:1px solid #eaddea;border-radius:16px}.tracking-title{font-weight:800;margin-bottom:14px;color:#701650}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{text-align:center;font-size:12px;color:#999}.step .dot{width:34px;height:34px;margin:0 auto 7px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eee;color:#777;font-weight:bold}.step.done,.step.current{color:#701650;font-weight:bold}.step.done .dot,.step.current .dot{background:linear-gradient(135deg,#e72b7b,#7025ed);color:#fff}.step.cancelled{color:#b42318;font-weight:bold}.step.cancelled .dot{background:#fde8e7;color:#b42318}.order-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.meta-box{background:#faf5fa;padding:11px 12px;border-radius:10px;font-size:13px}.meta-box b{display:block;color:#555;margin-bottom:4px}.delivery-box{margin-top:15px;padding:14px;background:#f6f0ff;border:1px solid #e3d6ff;border-radius:12px}.delivery-date{font-weight:bold;color:#701650;margin-top:5px}.success-box{background:#edfff4;border:1px solid #b9e8ca;color:#176b36;padding:14px;border-radius:12px;margin-bottom:15px}.error-box{background:#fff0f0;border:1px solid #f0bcbc;color:#9d2020;padding:14px;border-radius:12px;margin-bottom:15px}@media(max-width:650px){.timeline{grid-template-columns:repeat(2,1fr);row-gap:14px}.order-meta{grid-template-columns:1fr}.nav{flex-direction:column}.item{align-items:flex-start}.order-head{flex-direction:column}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">✨ Ziya Jewellery</div><div class="navlinks"><a href="index.html">🏠 Home</a><a href="categories.html">Categories</a><a href="wishlist.html">❤️ Saved</a><a href="cart.html">🛒 Cart</a></div></div></header>
<main class="container"><h1>📦 My Orders</h1><div class="login-card"><h2>Find Your Orders</h2><p class="note">Enter the 10-digit mobile number used while placing your order. You can also search directly using your Order ID.</p><input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="Enter 10 digit mobile number"><input id="orderId" type="text" maxlength="80" placeholder="Optional: Enter Order ID directly"><button id="searchBtn">🔎 View My Orders</button></div><div id="message"></div><div id="orders"></div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getFirestore,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBmapJhIb0QixjcUbLqB1X9l7EuPMqEUEQ",authDomain:"ziya-jewellery-d420f.firebaseapp.com",projectId:"ziya-jewellery-d420f",storageBucket:"ziya-jewellery-d420f.firebasestorage.app",messagingSenderId:"292032564389",appId:"1:292032564389:web:69b11699d8f790db5c114c"};const db=getFirestore(initializeApp(firebaseConfig));
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const money=v=>Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2});
function date(v){if(!v)return"";try{if(typeof v.toDate==="function")return v.toDate().toLocaleString("en-IN");let d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleString("en-IN")}catch{return""}}
function status(v){let s=String(v||"").trim().toLowerCase();if(["new","new order","confirmed"].includes(s))return"New Order";if(s==="processing")return"Processing";if(s==="shipped")return"Shipped";if(s==="delivered")return"Delivered";if(["cancelled","canceled"].includes(s))return"Cancelled";return"New Order"}
function tracking(v){let c=status(v);if(c==="Cancelled")return`<div class="tracking"><div class="tracking-title">📦 Order Tracking</div><div class="step cancelled"><div class="dot">✕</div>Cancelled</div><div class="note" style="margin-top:10px">This order has been cancelled.</div></div>`;let steps=[["New Order","🆕"],["Processing","⚙️"],["Shipped","🚚"],["Delivered","✓"]],n=steps.findIndex(x=>x[0]===c);return`<div class="tracking"><div class="tracking-title">📦 Order Tracking</div><div class="timeline">${steps.map((x,i)=>`<div class="step ${i<n?"done":i===n?"current":""}"><div class="dot">${i<=n?"✓":x[1]}</div>${x[0]}</div>`).join("")}</div></div>`}
function customer(o){let c=o.customer||{};return{name:o.customerName||c.name||o.name||"",phone:o.phone||c.phone||o.mobile||"",address:o.address||c.address||c.house||"",area:o.area||c.area||"",city:o.city||c.city||"",state:o.state||c.state||"",pin:o.pincode||o.pin||c.pin||c.pincode||"",landmark:o.landmark||c.landmark||""}}
function items(o){return Array.isArray(o.items)?o.items:Array.isArray(o.products)?o.products:o.product?[o.product]:[]}
function total(o){for(let k of ["finalTotal","total","grandTotal","totalAmount","amount"])if(o[k]!==undefined&&o[k]!==null)return Number(o[k])||0;return items(o).reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.quantity)||1),0)}
function payment(o){if(typeof o.payment==="string")return o.payment;if(o.paymentMethod)return o.paymentMethod;if(o.payment?.method)return o.payment.method;return"Not specified"}
function paymentStatus(o){return o.paymentStatus||o.payment?.status||"Pending"}
async function phoneSearch(p){let m=new Map;for(let f of ["phone","mobile"]){try{let s=await getDocs(query(collection(db,"orders"),where(f,"==",p)));s.forEach(d=>m.set(d.id,{id:d.id,...d.data()}))}catch(e){console.error(f,e)}}try{let s=await getDocs(query(collection(db,"orders"),where("customer.phone","==",p)));s.forEach(d=>m.set(d.id,{id:d.id,...d.data()}))}catch(e){console.error("customer.phone",e)}return[...m.values()]}
async function idSearch(id){let m=new Map;try{let s=await getDocs(query(collection(db,"orders"),where("orderId","==",id)));s.forEach(d=>m.set(d.id,{id:d.id,...d.data()}))}catch(e){console.error(e)}if(!m.size)try{let s=await getDocs(query(collection(db,"orders"),where("__name__","==",id)));s.forEach(d=>m.set(d.id,{id:d.id,...d.data()}))}catch(e){console.error(e)}return[...m.values()]}
function msg(t,ok=false){document.getElementById("message").innerHTML=`<div class="${ok?"success-box":"error-box"}">${esc(t)}</div>`}
async function load(){let p=document.getElementById("phone").value.trim(),id=document.getElementById("orderId").value.trim(),b=document.getElementById("searchBtn"),box=document.getElementById("orders");b.disabled=true;b.textContent="Loading...";box.innerHTML="";document.getElementById("message").innerHTML="";try{let os;if(id)os=await idSearch(id);else{if(!/^[0-9]{10}$/.test(p)){msg("Please enter a valid 10 digit mobile number.");return}os=await phoneSearch(p)}if(!os.length){box.innerHTML=`<div class="empty"><div class="empty-icon">📦</div><h2>No orders found</h2><p>We couldn't find an order with the entered details.</p><a class="shop" href="index.html">Continue Shopping</a></div>`;return}os.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));os.forEach(o=>{let c=customer(o),its=items(o),st=status(o.orderStatus||o.status),tot=total(o);let ih=its.length?its.map(i=>{let q=Number(i.quantity)||1,p=Number(i.price)||0;return`<div class="item">${i.image?`<img src="${esc(i.image)}" alt="Jewellery">`:`<div style="width:70px;height:70px;display:flex;align-items:center;justify-content:center;background:#f6edf4;border-radius:10px;font-size:35px">💎</div>`}<div class="item-info"><div class="item-name">${esc(i.name||"Jewellery")}</div><div class="price">₹${money(p*q)}</div><div class="note">Quantity: ${q}</div></div></div>`}).join(""):"<div class='note' style='padding:15px 0'>No item details available for this order.</div>";let del=o.deliveryDate||o.expectedDeliveryDate||"";let dh=del?`<div class="delivery-box">🚚 <b>Expected Delivery</b><div class="delivery-date">${esc(date(del))}</div></div>`:`<div class="delivery-box">🚚 <b>Delivery Information</b><div class="note">Delivery date will be shown after admin confirmation.</div></div>`;let vd=Number(o.voucherDiscount||o.discountAmount||0),pd=Number(o.productDiscount||o.offerDiscount||o.saleDiscount||0);let ah=`<b>Delivery Address</b><br>${esc(c.name)}${c.name?"<br>":""}${esc(c.address)}${c.address?"<br>":""}${c.area?esc(c.area)+"<br>":""}${esc(c.city)}${c.city?", ":""}${esc(c.state)}${c.pin?" - "+esc(c.pin):""}${c.landmark?`<br>Landmark: ${esc(c.landmark)}`:""}${c.phone?`<br>📱 Mobile: ${esc(c.phone)}`:""}`;let card=document.createElement("div");card.className="order-card";card.innerHTML=`<div class="order-head"><div><div class="order-id">Order ID: ${esc(o.orderId||o.id)}</div><div class="note">${esc(date(o.createdAt))}</div></div><div class="status">${esc(st)}</div></div><div>${ih}</div><div class="total">Total: ₹${money(tot)}</div><div class="order-meta"><div class="meta-box"><b>💳 Payment</b>${esc(payment(o))}</div><div class="meta-box"><b>💰 Payment Status</b>${esc(paymentStatus(o))}</div>${pd>0?`<div class="meta-box"><b>🏷️ Product Offer Discount</b>₹${money(pd)}</div>`:""}${o.voucherCode?`<div class="meta-box"><b>🎟️ Voucher</b>${esc(o.voucherCode)}</div>`:""}${vd>0?`<div class="meta-box"><b>🏷️ Voucher Discount</b>₹${money(vd)}</div>`:""}</div>${tracking(st)}${dh}<div class="address">${ah}</div><a class="buy-again" href="index.html">🛍️ Buy Again</a>`;box.appendChild(card)});msg(os.length+(os.length===1?" order found.":" orders found."),true)}catch(e){console.error("Orders load error",e);msg("Unable to load orders. Please try again. Error: "+e.message)}finally{b.disabled=false;b.textContent="🔎 View My Orders"}}
document.getElementById("searchBtn").addEventListener("click",load);document.getElementById("phone").addEventListener("keydown",e=>{if(e.key==="Enter")load()});document.getElementById("orderId").addEventListener("keydown",e=>{if(e.key==="Enter")load()});
</script>
</body>
</html>
