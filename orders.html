<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>My Orders | Ziya Jewellery</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#fff6fb,#f1eaff);
color:#29152e;
}

header{
background:linear-gradient(135deg,#8d1455,#5c1b9e);
color:white;
padding:17px 20px;
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.logo{
font-size:25px;
font-weight:bold;
}

.navlinks{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.navlinks a{
color:white;
text-decoration:none;
padding:9px 12px;
border-radius:18px;
background:#ffffff1c;
font-size:13px;
}

.container{
max-width:1000px;
margin:30px auto;
padding:0 18px;
}

h1{
color:#701650;
}

.login-card,
.order-card,
.empty{
background:white;
border-radius:20px;
padding:22px;
box-shadow:0 10px 35px #5b245018;
margin-bottom:20px;
}

input{
width:100%;
padding:13px;
border:1px solid #ddd2df;
border-radius:10px;
margin-top:8px;
font-size:15px;
}

button{
border:0;
padding:13px 18px;
border-radius:10px;
background:linear-gradient(135deg,#e72b7b,#7025ed);
color:white;
font-weight:bold;
cursor:pointer;
margin-top:12px;
}

.order-head{
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
border-bottom:1px solid #eee;
padding-bottom:15px;
}

.order-id{
font-weight:bold;
color:#721550;
}

.status{
padding:7px 12px;
border-radius:20px;
background:#f7e7ef;
color:#721550;
font-weight:bold;
font-size:13px;
}

.item{
display:flex;
gap:12px;
padding:14px 0;
border-bottom:1px solid #eee;
}

.item img{
width:70px;
height:70px;
object-fit:cover;
border-radius:10px;
background:#f6edf4;
}

.item-info{
flex:1;
}

.item-name{
font-weight:bold;
}

.price{
color:#a01762;
font-weight:bold;
margin-top:5px;
}

.total{
text-align:right;
font-size:20px;
font-weight:bold;
color:#721550;
margin-top:15px;
}

.address{
margin-top:15px;
padding:14px;
background:#faf5fa;
border-radius:12px;
font-size:14px;
line-height:1.6;
}

.buy-again{
display:inline-block;
margin-top:15px;
padding:11px 15px;
border-radius:10px;
background:#f0e3f3;
color:#701650;
text-decoration:none;
font-weight:bold;
}

.empty{
text-align:center;
padding:55px 20px;
}

.empty-icon{
font-size:65px;
}

.shop{
display:inline-block;
margin-top:15px;
padding:12px 20px;
border-radius:22px;
background:#721550;
color:white;
text-decoration:none;
}

.note{
font-size:13px;
color:#777;
line-height:1.5;
}


.tracking{
  margin-top:18px;
  padding:16px;
  background:#fff8fc;
  border:1px solid #eaddea;
  border-radius:16px;
}
.tracking-title{
  font-weight:800;
  margin-bottom:14px;
  color:#701650;
}
.timeline{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.step{
  position:relative;
  text-align:center;
  font-size:12px;
  color:#999;
}
.step .dot{
  width:34px;
  height:34px;
  margin:0 auto 7px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  color:#777;
  font-weight:bold;
}
.step.done,
.step.current{
  color:#701650;
  font-weight:bold;
}
.step.done .dot,
.step.current .dot{
  background:linear-gradient(135deg,#e72b7b,#7025ed);
  color:white;
}
.step.cancelled{
  color:#b42318;
  font-weight:bold;
}
.step.cancelled .dot{
  background:#fde8e7;
  color:#b42318;
}
.order-meta{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}
.meta-box{
  background:#faf5fa;
  padding:11px 12px;
  border-radius:10px;
  font-size:13px;
}
.meta-box b{
  display:block;
  color:#555;
  margin-bottom:4px;
}
@media(max-width:650px){
  .timeline{grid-template-columns:repeat(2,1fr);row-gap:14px}
  .order-meta{grid-template-columns:1fr}
}

@media(max-width:650px){

.nav{
flex-direction:column;
}

.item{
align-items:flex-start;
}

.order-head{
flex-direction:column;
}

}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
✨ Ziya Jewellery
</div>

<div class="navlinks">

<a href="index.html">🏠 Home</a>

<a href="categories.html">Categories</a>

<a href="wishlist.html">❤️ Saved</a>

<a href="cart.html">🛒 Cart</a>

</div>

</div>

</header>


<main class="container">

<h1>📦 My Orders</h1>


<div class="login-card">

<h2>Find Your Orders</h2>

<p class="note">
Enter the 10-digit mobile number used while placing your order. Your order details and live status will appear securely below.
</p>

<input
id="phone"
type="tel"
inputmode="numeric"
maxlength="10"
placeholder="Enter 10 digit mobile number"
>

<input
id="orderId"
type="text"
maxlength="80"
placeholder="Optional: Enter Order ID directly"
>

<button id="searchBtn">
🔎 View My Orders
</button>

</div>


<div id="message"></div>

<div id="orders"></div>

</main>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBmapJhIb0QixjcUbqLqB1X9l7EuPMqEUEQ",authDomain:"ziya-jewellery-d420f.firebaseapp.com",projectId:"ziya-jewellery-d420f",storageBucket:"ziya-jewellery-d420f.firebasestorage.app",messagingSenderId:"292032564389",appId:"1:292032564389:web:69b11699d8f790db5c114c"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
function escapeHTML(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function showMessage(text){document.getElementById("message").innerHTML=`<div class="login-card">${escapeHTML(text)}</div>`;}
function formatDate(v){if(!v)return "";try{return typeof v.toDate==="function"?v.toDate().toLocaleString("en-IN"):new Date(v).toLocaleString("en-IN")}catch{return ""}}
function normalizeStatus(s){s=String(s||"").trim().toLowerCase();if(["new","new order","confirmed"].includes(s))return "New Order";if(s==="processing")return "Processing";if(s==="shipped")return "Shipped";if(s==="delivered")return "Delivered";if(["cancelled","canceled"].includes(s))return "Cancelled";return "New Order";}
function trackingHTML(status){const cur=normalizeStatus(status);if(cur==="Cancelled")return `<div class="tracking"><div class="tracking-title">📦 Order Tracking</div><div class="step cancelled"><div class="dot">✕</div>Cancelled</div></div>`;const steps=["New Order","Processing","Shipped","Delivered"];const ci=steps.indexOf(cur);return `<div class="tracking"><div class="tracking-title">📦 Order Tracking</div><div class="timeline">${steps.map((x,i)=>`<div class="step ${i<ci?"done":i===ci?"current":""}"><div class="dot">${i<=ci?"✓":"○"}</div>${x}</div>`).join("")}</div></div>`;}
async function findByOrderId(id){id=String(id||"").trim();if(!id)return [];const out=[];try{const d=await getDoc(doc(db,"orders",id));if(d.exists())out.push({id:d.id,...d.data()});}catch(e){console.warn("doc id search",e)}for(const field of ["orderId","orderID","id"]){try{const snap=await getDocs(query(collection(db,"orders"),where(field,"==",id)));snap.forEach(d=>out.push({id:d.id,...d.data()}));}catch(e){console.warn("order field search",field,e)}}return [...new Map(out.map(x=>[x.id,x])).values()];}
async function findByPhone(phone){const results=new Map(), s=String(phone||"").trim(), n=Number(s);const searches=[["phone",s],["phone",n],["mobile",s],["mobile",n],["customer.phone",s],["customer.phone",n],["customer.mobile",s],["customer.mobile",n]];for(const [field,value] of searches){if(value===""||value==null||Number.isNaN(value))continue;try{const snap=await getDocs(query(collection(db,"orders"),where(field,"==",value)));snap.forEach(d=>results.set(d.id,{id:d.id,...d.data()}));}catch(e){console.warn("phone search failed",field,value,e)}}return [...results.values()];}
async function loadOrders(){const phone=document.getElementById("phone").value.trim();const orderId=document.getElementById("orderId").value.trim();if(!phone&&!orderId){showMessage("Please enter Mobile Number or Order ID.");return}if(phone&&!/^[0-9]{10}$/.test(phone)){showMessage("Please enter a valid 10 digit mobile number.");return}const button=document.getElementById("searchBtn");button.disabled=true;button.textContent="Loading...";try{let orders=[];if(orderId)orders=await findByOrderId(orderId);if(phone){const byPhone=await findByPhone(phone);const map=new Map(orders.map(o=>[o.id,o]));byPhone.forEach(o=>map.set(o.id,o));orders=[...map.values()];}const box=document.getElementById("orders");box.innerHTML="";if(!orders.length){box.innerHTML=`<div class="empty"><div class="empty-icon">📦</div><h2>No orders found</h2><p>We couldn't find an order for the details entered.</p><a class="shop" href="index.html">Continue Shopping</a></div>`;return}orders.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));orders.forEach(order=>{const card=document.createElement("div");card.className="order-card";const status=order.status||"New";let itemsHTML="";(order.items||[]).forEach(item=>{const q=Number(item.quantity)||1,p=Number(item.price)||0;itemsHTML+=`<div class="item">${item.image?`<img src="${escapeHTML(item.image)}" alt="">`:`<div style="width:70px;height:70px;display:flex;align-items:center;justify-content:center;background:#f6edf4;border-radius:10px;font-size:35px">💎</div>`}<div class="item-info"><div class="item-name">${escapeHTML(item.name||"Jewellery")}</div><div class="price">₹${(p*q).toLocaleString("en-IN")}</div><div class="note">Quantity: ${q}</div></div></div>`});const c=order.customer||{};const delivery=order.confirmedDeliveryDate||order.deliveryDate||order.delivery?.confirmedDate||order.delivery?.date;const refund=order.refundStatus||order.refund?.status;const returnStatus=order.returnStatus||order.return?.status;card.innerHTML=`<div class="order-head"><div><div class="order-id">Order ID: ${escapeHTML(order.orderId||order.id)}</div><div class="note">${formatDate(order.createdAt)}</div></div><div class="status">${escapeHTML(status)}</div></div><div>${itemsHTML}</div><div class="total">Total: ₹${Number(order.total||0).toLocaleString("en-IN")}</div><div class="order-meta"><div class="meta-box"><b>💳 Payment</b>${escapeHTML(order.paymentMethod||order.payment?.method||"Not specified")}</div><div class="meta-box"><b>💰 Payment Status</b>${escapeHTML(order.paymentStatus||order.payment?.status||"Pending")}</div></div>${delivery?`<div class="meta-box" style="margin-top:12px"><b>📅 Confirmed Delivery Date</b><br>${escapeHTML(formatDate(delivery))}</div>`:""}${refund?`<div class="meta-box" style="margin-top:12px"><b>💸 Payment Refund</b><br>${escapeHTML(refund)}</div>`:""}${returnStatus?`<div class="meta-box" style="margin-top:12px"><b>↩️ Return Status</b><br>${escapeHTML(returnStatus)}</div>`:""}${trackingHTML(status)}<div class="address"><b>Delivery Address</b><br>${escapeHTML(c.name)}<br>${escapeHTML(c.house)}, ${escapeHTML(c.area)}<br>${escapeHTML(c.city)}, ${escapeHTML(c.state)} - ${escapeHTML(c.pin)}${c.landmark?`<br>Landmark: ${escapeHTML(c.landmark)}`:""}<br>Mobile: ${escapeHTML(c.phone||c.mobile)}</div><a class="buy-again" href="index.html">🛍️ Buy Again</a>`;box.appendChild(card)});}catch(e){console.error(e);showMessage("Unable to load orders. Please try again.");}finally{button.disabled=false;button.textContent="🔎 View My Orders"}}
document.getElementById("searchBtn").addEventListener("click",loadOrders);
</script>

</body>
</html>
