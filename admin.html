<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ziya Jewellery | Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#fff0f6,#eee7ff);
color:#29152e
}

.container{
max-width:1200px;
margin:auto;
padding:20px
}

.login,.panel{
background:#fff;
border-radius:24px;
box-shadow:0 15px 45px #5d326622
}

.login{
max-width:440px;
margin:70px auto;
padding:35px 25px;
text-align:center
}

.logo{
font-size:32px;
font-weight:800;
color:#d92878
}

.google{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
background:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer
}

.google:hover{
background:#fafafa
}

.panel{
display:none;
padding:25px
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:25px
}

.header h1{
margin:0 0 5px
}

.email{
font-size:14px;
color:#777
}

button{
cursor:pointer
}

.logout,.delete,.statusBtn,.refresh,.tab{
border:0;
border-radius:10px;
padding:10px 14px;
font-weight:bold
}

.logout{
background:#ffe5ed;
color:#a00038
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px
}

.card{
background:#fff8fc;
border-radius:20px;
padding:22px
}

label{
display:block;
font-weight:bold;
margin-top:10px
}

input,select,textarea{
width:100%;
padding:12px;
margin:7px 0 12px;
border:1px solid #ddd1e2;
border-radius:10px;
font-size:15px
}

textarea{
min-height:100px;
resize:vertical
}

.add{
width:100%;
padding:14px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#e72b7b,#7228ff);
color:#fff;
font-size:16px;
font-weight:bold
}

.product{
padding:15px 0;
border-bottom:1px solid #eaddea
}

.product img{
width:75px;
height:75px;
object-fit:cover;
border-radius:10px;
float:left;
margin-right:12px
}

.product:after{
content:"";
display:block;
clear:both
}

.delete{
background:#ffe5e9;
color:#a00038;
margin-top:10px
}

.share{
display:inline-block;
background:#e8fff0;
color:#08743d;
padding:8px 12px;
border-radius:8px;
text-decoration:none;
margin-top:10px
}

.msg{
display:none;
padding:12px;
border-radius:10px;
margin-bottom:15px
}

.error{
background:#fff0f3;
color:#a00030
}

.success{
background:#e8fff0;
color:#08743d
}

.preview{
width:100%;
max-height:220px;
object-fit:contain;
display:none;
border-radius:12px;
margin-bottom:10px
}

/* ORDERS */

.orders-section{
margin-top:25px
}

.order-card{
background:white;
border-radius:18px;
padding:18px;
margin-bottom:15px;
box-shadow:0 6px 20px #5d326612;
border:1px solid #f0e4ef
}

.order-top{
display:flex;
justify-content:space-between;
gap:15px;
flex-wrap:wrap;
border-bottom:1px solid #eee;
padding-bottom:13px;
margin-bottom:13px
}

.order-id{
font-weight:bold;
color:#74154f
}

.order-date{
font-size:12px;
color:#777;
margin-top:5px
}

.status{
display:inline-block;
padding:7px 12px;
border-radius:20px;
background:#f4e8f2;
color:#721550;
font-weight:bold;
font-size:12px
}

.customer-box,
.address-box{
background:#faf6fa;
border-radius:12px;
padding:13px;
margin:10px 0;
line-height:1.6;
font-size:14px
}

.order-item{
display:flex;
gap:12px;
padding:12px 0;
border-bottom:1px solid #eee
}

.order-item img{
width:60px;
height:60px;
border-radius:9px;
object-fit:cover
}

.order-item-info{
flex:1
}

.order-total{
text-align:right;
font-size:19px;
font-weight:bold;
color:#8b1657;
margin-top:14px
}

.status-actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:15px
}

.statusBtn{
color:white
}

.confirm{
background:#08743d
}

.dispatch{
background:#1565c0
}

.delivered{
background:#6a1b9a
}

.cancel{
background:#b00020
}

.refresh{
background:#eee3f1;
color:#641449
}

.tabs{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:18px
}

.tab{
background:#eee5f1;
color:#641449
}

.tab.active{
background:#721550;
color:white
}

.order-empty{
text-align:center;
padding:35px;
color:#777
}

@media(max-width:750px){

.grid{
grid-template-columns:1fr
}

.header{
align-items:flex-start;
flex-direction:column
}

.status-actions{
display:grid;
grid-template-columns:1fr 1fr
}

.statusBtn{
width:100%
}

}
</style>
</head>

<!-- PRODUCTS -->

<div class="grid">

<!-- ADD PRODUCT -->

<div class="card">

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
getAuth,
GoogleAuthProvider,
signInWithRedirect,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig={

apiKey:
"AIzaSyBmapJhIb0QixjcUbLqB1X9l7EuPMqEUEQ",

authDomain:
"ziya-jewellery-d420f.firebaseapp.com",

projectId:
"ziya-jewellery-d420f",

storageBucket:
"ziya-jewellery-d420f.firebasestorage.app",

messagingSenderId:
"292032564389",

appId:
"1:292032564389:web:69b11699d8f790db5c114c"

};


/* ADMIN EMAIL */

const ADMIN_EMAIL=
"gifthamperlovers@gmail.com";


/* FIREBASE START */

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);

const provider=
new GoogleAuthProvider();


const loginBox=
document.getElementById("loginBox");

const panel=
document.getElementById("panel");

const productsBox=
document.getElementById("products");

const ordersBox=
document.getElementById("orders");

const statusBox=
document.getElementById("status");

let allOrders=[];

let orderFilter="all";


/* MESSAGE */

function message(el,text,type){

el.textContent=text;

el.className=
"msg "+type;

el.style.display="block";

}


/* ESCAPE */

function escapeHTML(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* DATE */

function formatDate(timestamp){

if(!timestamp)
return "Date unavailable";

try{

return timestamp
.toDate()
.toLocaleString("en-IN");

}
catch{

return "Date unavailable";

}

}


/* GOOGLE LOGIN - REDIRECT */

document
.getElementById("loginBtn")
.addEventListener(
"click",
async()=>{

try{

message(
document.getElementById("loginMsg"),
"Opening Google Login...",
"success"
);

await signInWithRedirect(
auth,
provider
);

}
catch(error){

console.error(error);

message(
document.getElementById("loginMsg"),
"Login error: "+error.message,
"error"
);

}

});


/* AUTH STATE */

onAuthStateChanged(
auth,
user=>{

if(
user &&
(user.email||"")
.toLowerCase()
===
ADMIN_EMAIL.toLowerCase()
){

loginBox.style.display="none";

panel.style.display="block";

document.getElementById(
"adminEmail"
).textContent=
"Logged in: "+user.email;

loadProducts();

loadOrders();

}
else{

loginBox.style.display="block";

panel.style.display="none";

if(user){

signOut(auth);

message(
document.getElementById("loginMsg"),
"Access denied. Please use the authorized Gmail.",
"error"
);

}

}

});


/* LOGOUT */

document
.getElementById("logout")
.addEventListener(
"click",
async()=>{

await signOut(auth);

location.reload();

});


/* PHOTO PREVIEW */

document
.getElementById("photo")
.addEventListener(
"change",
function(){

const file=this.files[0];

if(!file)
return;

const preview=
document.getElementById("preview");

preview.src=
URL.createObjectURL(file);

preview.style.display="block";

});


/* ADD PRODUCT */

document
.getElementById("productForm")
.addEventListener(
"submit",
async event=>{

event.preventDefault();

const user=
auth.currentUser;

if(!user){

alert("Please login first.");

return;

}


try{

await addDoc(
collection(db,"products"),
{

name:
document.getElementById("name")
.value.trim(),

metal:
document.getElementById("metal")
.value,

purity:
document.getElementById("purity")
.value,

category:
document.getElementById("category")
.value,

subcategory:
document.getElementById("subcategory")
.value,

price:
Number(
document.getElementById("price")
.value
)||0,

weight:
document.getElementById("weight")
.value.trim(),

size:
document.getElementById("size")
.value.trim(),

stock:
Number(
document.getElementById("stock")
.value
)||0,

sku:
document.getElementById("sku")
.value.trim(),

image:
document.getElementById("imageUrl")
.value.trim(),

description:
document.getElementById("description")
.value.trim(),

featured:
document.getElementById("featured")
.checked,

createdBy:
user.email,

createdAt:
serverTimestamp()

});

event.target.reset();

document.getElementById(
"preview"
).style.display="none";

message(
statusBox,
"Product added successfully ✨",
"success"
);

loadProducts();

}
catch(error){

console.error(error);

message(
statusBox,
"Product save failed: "+error.message,
"error"
);

}

});


/* LOAD PRODUCTS */

async function loadProducts(){

try{

const snap=
await getDocs(
collection(db,"products")
);

if(snap.empty){

productsBox.innerHTML=
"<p>No products yet.</p>";

return;

}

productsBox.innerHTML="";


snap.forEach(item=>{

const p=item.data();

const div=
document.createElement("div");

div.className="product";


const img=
p.image
?
`
<img
src="${escapeHTML(p.image)}"
alt="${escapeHTML(p.name||"Jewellery")}"
>
`
:"";


const shareText=
encodeURIComponent(

`✨ ${p.name||"Ziya Jewellery Product"}

Metal: ${p.metal||""}
Purity: ${p.purity||""}
Price: ₹${p.price||""}

Ziya Jewellery`

);


div.innerHTML=`

${img}

<strong>
${escapeHTML(
p.name||"Product"
)}
</strong>

<br>

<small>

${escapeHTML(
p.metal||""
)}

•

${escapeHTML(
p.purity||""
)}

•

₹${escapeHTML(
String(p.price||"")
)}

</small>

<br>

<small>

Category:
${escapeHTML(
p.category||""
)}

</small>

<br>

<a
class="share"
target="_blank"
href="https://wa.me/?text=${shareText}"
>

📲 Share on WhatsApp

</a>

<br>

<button
class="delete"
data-id="${item.id}"
>

🗑️ Delete

</button>

`;


div
.querySelector(".delete")
.addEventListener(
"click",
async()=>{

if(
confirm(
"Delete this product?"
)
){

await deleteDoc(
doc(
db,
"products",
item.id
)
);

loadProducts();

}

});


productsBox.appendChild(div);

});

}
catch(error){

console.error(error);

productsBox.innerHTML=
"<p>Unable to load products.</p>";

}

}


/* LOAD ORDERS */

async function loadOrders(){

ordersBox.innerHTML=
"Loading orders...";

try{

const snap=
await getDocs(
collection(db,"orders")
);

allOrders=[];

snap.forEach(item=>{

allOrders.push({

id:item.id,

...item.data()

});

});


allOrders.sort(
(a,b)=>{

const aTime=
a.createdAt?.seconds||0;

const bTime=
b.createdAt?.seconds||0;

return bTime-aTime;

});


renderOrders();

}
catch(error){

console.error(error);

ordersBox.innerHTML=`

<div class="order-empty">

❌ Unable to load orders.

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

}


/* RENDER ORDERS */

function renderOrders(){

let list=
[...allOrders];


if(orderFilter!=="all"){

list=
list.filter(
order=>
(order.status||"New")
===
orderFilter
);

}


if(!list.length){

ordersBox.innerHTML=`

<div class="order-empty">

📦

<h3>No orders found</h3>

<p>
Customer orders will appear here.
</p>

</div>

`;

return;

}


ordersBox.innerHTML="";


list.forEach(order=>{

const customer=
order.customer||{};

const currentStatus=
order.status||"New";

const items=
Array.isArray(order.items)
?
order.items
:
[];


let itemsHTML="";


items.forEach(item=>{

itemsHTML+=`

<div class="order-item">

${
item.image
?
`
<img
src="${escapeHTML(item.image)}"
alt=""
>
`
:
`
<div style="
width:60px;
height:60px;
border-radius:9px;
background:#f4eaf3;
display:flex;
align-items:center;
justify-content:center;
font-size:27px;
">
💎
</div>
`
}

<div class="order-item-info">

<strong>
${escapeHTML(
item.name||"Jewellery"
)}
</strong>

<br>

<small>
Metal:
${escapeHTML(
item.metal||""
)}
</small>

<br>

<small>
Quantity:
${Number(
item.quantity||1
)}
</small>

<br>

<strong>
₹${Number(
item.price||0
).toLocaleString("en-IN")}
</strong>

</div>

</div>

`;

});


const card=
document.createElement("div");

card.className="order-card";


card.innerHTML=`

<div class="order-top">

<div>

<div class="order-id">

Order ID:
${escapeHTML(
order.orderId||order.id
)}

</div>

<div class="order-date">

${formatDate(
order.createdAt
)}

</div>

</div>

<div class="status">

${escapeHTML(
currentStatus
)}

</div>

</div>


<div class="customer-box">

<strong>👤 Customer Details</strong>

<br>

Name:
${escapeHTML(
customer.name||"Not provided"
)}

<br>

Mobile:
${escapeHTML(
customer.phone||"Not provided"
)}

<br>

Email:
${escapeHTML(
customer.email||"Not provided"
)}

</div>


<div class="address-box">

<strong>
🏠 Shipping Address
</strong>

<br><br>

${escapeHTML(
customer.name||""
)}

<br>

${escapeHTML(
customer.house||""
)}

<br>

${escapeHTML(
customer.area||""
)}

<br>

${escapeHTML(
customer.city||""
)},
${escapeHTML(
customer.state||""
)}
-
${escapeHTML(
customer.pin||""
)}

${
customer.landmark
?
`
<br>
Landmark:
${escapeHTML(customer.landmark)}
`
:""
}

<br>

📱
${escapeHTML(
customer.phone||""
)}

</div>


<strong>
💎 Ordered Items
</strong>

${itemsHTML}


<div class="order-total">

Total:
₹${Number(
order.total||0
).toLocaleString("en-IN")}

</div>


<div class="status-actions">

<button
class="statusBtn confirm"
data-status="Confirmed"
data-id="${order.id}"
>
✅ Confirm
</button>

<button
class="statusBtn dispatch"
data-status="Dispatched"
data-id="${order.id}"
>
🚚 Dispatch
</button>

<button
class="statusBtn delivered"

card
.querySelectorAll("[data-status]")
.forEach(button=>{

button.addEventListener(
"click",
async()=>{

const newStatus=
button.dataset.status;

const orderId=
button.dataset.id;


if(
!confirm(
`Change order status to ${newStatus}?`
)
)
return;


try{

await updateDoc(
doc(
db,
"orders",
orderId
),
{

status:newStatus,

updatedAt:
serverTimestamp()

}
);


const found=
allOrders.find(
x=>x.id===orderId
);

if(found){

found.status=
newStatus;

}


renderOrders();

message(
statusBox,
`Order updated: ${newStatus}`,
"success"
);

}
catch(error){

console.error(error);

message(
statusBox,
"Order update failed: "+
error.message,
"error"
);

}

});

});


ordersBox.appendChild(card);

});

}
