<style>

*{

}

body{

.container{

.login,

.delete{

.msg{

.preview-grid{

.preview-grid img{

.order{

.order-title{

.order-row{

.order-items{

.order-item{

.order-item img{

}

.order-item-info{

}

.status-badge,

}

.payment-badge{

}

.order-actions{

.statusBtn{

.cancelBtn{

.attachment{

}

.empty{

.offer-box{

@media(max-width:750px){

  grid-template-columns:1fr
 }

  align-items:flex-start;
  flex-direction:column
 }

 .logout{
  width:100%
 }

 .order-item{
  align-items:flex-start
 }

}

</style>
</head>

<script type="module">


/* FIREBASE */

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
 getAuth,
 GoogleAuthProvider,
 signInWithPopup,
 signOut,
 onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 deleteDoc,
 doc,
 updateDoc,
 serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
 getStorage,
 ref,
 uploadBytes,
 getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

 apiKey:
 "AIzaSyBmapJhIb0QixjcUbLqB1X9l7EuPMqEUEQ",

 authDomain:
 "ziya-jewellery-d420f.firebaseapp.com",

 projectId:
 "ziya-jewellery-d420f",

 storageBucket:
 "ziya-jewellery-d420f.firebasestorage.app",

 messagingSenderId:
 "292032564389",

 appId:
 "1:292032564389:web:69b11699d8f790db5c114c"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const storage =
getStorage(app);

const provider =
new GoogleAuthProvider();


/* ADMIN */

const ADMIN_EMAIL =
"gifthamperlovers@gmail.com";


/* ELEMENTS */

const loginBox =
document.getElementById("loginBox");

const panel =
document.getElementById("panel");

const products =
document.getElementById("products");

const orders =
document.getElementById("orders");

const status =
document.getElementById("status");


/* MESSAGE */

function message(
 el,
 text,
 type
){

 el.textContent =
 text;

 el.className =
 "msg " + type;

 el.style.display =
 "block";

}


/* ESCAPE */

function escapeHTML(value){

 return String(value ?? "")

 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


/* LOGIN */

document
.getElementById("loginBtn")
.addEventListener(
 "click",
 async()=>{

  try{

   const result =
   await signInWithPopup(
    auth,
    provider
   );

   const email =
   (result.user.email || "")
   .toLowerCase();

   if(
    email !==
    ADMIN_EMAIL.toLowerCase()
   ){

    await signOut(auth);

    message(
     document.getElementById(
      "loginMsg"
     ),
     "Access denied. This Gmail is not authorized.",
     "error"
    );

   }

  }
  catch(error){

   console.error(error);

   message(
    document.getElementById(
     "loginMsg"
    ),
    "Login failed: " +
    error.message,
    "error"
   );

  }

 }
);


/* AUTH STATE */

onAuthStateChanged(
 auth,
 user=>{

  if(
   user &&
   (user.email || "")
   .toLowerCase()
   ===
   ADMIN_EMAIL.toLowerCase()
  ){

   loginBox.style.display =
   "none";

   panel.style.display =
   "block";

   document.getElementById(
    "adminEmail"
   ).textContent =
   "Logged in: " +
   user.email;

   loadProducts();
   loadOrders();

  }
  else{

   loginBox.style.display =
   "block";

   panel.style.display =
   "none";

  }

 }
);


/* LOGOUT */

document
.getElementById("logout")
.addEventListener(
 "click",
 ()=>signOut(auth)
);


/* PHOTO PREVIEW */

document
.getElementById("photo")
.addEventListener(
 "change",
 function(){

  const previewGrid =
  document.getElementById(
   "previewGrid"
  );

  previewGrid.innerHTML = "";

  const files =
  Array.from(
   this.files || []
  );

  files.forEach(
   file=>{

    const url =
    URL.createObjectURL(
     file
    );

    const img =
    document.createElement(
     "img"
    );

    img.src =
    url;

    img.alt =
    "Preview";

    previewGrid.appendChild(
     img
    );

   }
  );

 }
);


/* SALE PRICE PREVIEW */

function updateSalePreview(){

 const price =
 Number(
  document.getElementById(
   "price"
  ).value || 0
 );

 const discount =
 Number(
  document.getElementById(
   "discountPercent"
  ).value || 0
 );

 const active =
 document.getElementById(
  "offerActive"
 ).checked;

 let salePrice =
 price;

 if(
  active &&
  discount > 0
 ){

  salePrice =
  price -
  (
   price * discount / 100
  );

 }

 document.getElementById(
  "salePreview"
 ).textContent =
 "Sale Price: ₹" +
 Math.round(
  salePrice
 ).toLocaleString(
  "en-IN"
 );

}


document
.getElementById("price")
.addEventListener(
 "input",
 updateSalePreview
);


document
.getElementById("discountPercent")
.addEventListener(
 "input",
 updateSalePreview
);


document
.getElementById("offerActive")
.addEventListener(
 "change",
 updateSalePreview
);


/* ADD PRODUCT */

document
.getElementById("productForm")
.addEventListener(
 "submit",
 async event=>{

  event.preventDefault();

  const user =
  auth.currentUser;

  if(!user){

   message(
    status,
    "Please login first.",
    "error"
   );

   return;

  }


  try{

   const photoInput =
   document.getElementById(
    "photo"
   );

   const files =
   Array.from(
    photoInput.files || []
   );


   let images = [];


   /*
    UPLOAD MULTIPLE PHOTOS
   */

   if(files.length){

    message(
     status,
     "Uploading " +
     files.length +
     " photo(s)...",
     "success"
    );


    for(
     let i = 0;
     i < files.length;
     i++
    ){

     const file =
     files[i];


     const safeName =
     file.name
     .replace(
      /[^a-zA-Z0-9.-]/g,
      "_"
     );


     const fileName =
     Date.now() +
     "_" +
     i +
     "_" +
     safeName;


     const storageRef =
     ref(
      storage,
      "products/" +
      fileName
     );


     await uploadBytes(
      storageRef,
      file
     );


     const url =
     await getDownloadURL(
      storageRef
     );


     images.push(
      url
     );

    }

   }


   /*
    OPTIONAL URL
   */

   const manualUrl =
   document
   .getElementById(
    "imageUrl"
   )
   .value
   .trim();


   if(
    manualUrl &&
    !images.length
   ){

    images.push(
     manualUrl
    );

   }


   const price =
   Number(
    document
    .getElementById(
     "price"
    )
    .value || 0
   );


   const discountPercent =
   Math.min(
    100,
    Math.max(
     0,
     Number(
      document
      .getElementById(
       "discountPercent"
      )
      .value || 0
     )
    )
   );


   const offerActive =
   document
   .getElementById(
    "offerActive"
   )
   .checked;


   const salePrice =
   offerActive &&
   discountPercent > 0
   ?
   Math.round(
    price -
    (
     price *
     discountPercent /
     100
    )
   )
   :
   price;


   /*
    FIRESTORE PRODUCT
   */

   await addDoc(
    collection(
     db,
     "products"
    ),
    {

     name:
      document
      .getElementById("name")
      .value
      .trim(),

     metal:
      document
      .getElementById("metal")
      .value,

     purity:
      document
      .getElementById("purity")
      .value,

     category:
      document
      .getElementById("category")
      .value,

     subcategory:
      document
      .getElementById("subcategory")
      .value,

     price:
      price,

     discountPercent:
      discountPercent,

     offerActive:
      offerActive,

     salePrice:
      salePrice,

     weight:
      document
      .getElementById("weight")
      .value
      .trim(),

     size:
      document
      .getElementById("size")
      .value
      .trim(),

     stock:
      Number(
       document
       .getElementById("stock")
       .value || 0
      ),

     sku:
      document
      .getElementById("sku")
      .value
      .trim(),

     /*
      First image kept for
      compatibility with old pages.
     */

     image:
      images[0] || "",

     /*
      All product images.
     */

     images:
      images,

     description:
      document
      .getElementById("description")
      .value
      .trim(),

     featured:
      document
      .getElementById("featured")
      .checked,

     views:
      0,

     createdBy:
      user.email,

     createdAt:
      serverTimestamp()

    }
   );


   event.target.reset();

   document.getElementById(
    "previewGrid"
   ).innerHTML = "";


   updateSalePreview();


   message(
    status,
    "Product added successfully ✨ Photos and offer saved.",
    "success"
   );


   loadProducts();

  }
  catch(error){

   console.error(error);

   message(
    status,
    "Product save failed: " +
    error.message,
    "error"
   );

  }

 }
);


/* LOAD PRODUCTS */

async function loadProducts(){

 try{

  const snap =
  await getDocs(
   collection(
    db,
    "products"
   )
  );


  if(snap.empty){

   products.innerHTML =
   "<p class='empty'>No products yet.</p>";

   return;

  }


  products.innerHTML = "";


  snap.forEach(
   item=>{

    const p =
    item.data();


    const div =
    document.createElement(
     "div"
    );

    div.className =
    "product";


    const images =
    Array.isArray(
     p.images
    ) &&
    p.images.length
    ?
    p.images
    :
    (
     p.image
     ?
     [p.image]
     :
     []
    );


    let imageHTML = "";


    if(images.length){

     imageHTML =
     `<div class="product-images">` +
     images
     .map(
      url=>
      `<img
       src="${escapeHTML(url)}"
       alt="Jewellery"
      >`
     )
     .join("") +
     `</div>`;

    }


    const discount =
    Number(
     p.discountPercent || 0
    );


    const offer =
    p.offerActive &&
    discount > 0;


    const sale =
    Number(
     p.salePrice ??
     p.price ??
     0
    );


    const shareText =
    encodeURIComponent(
     `✨ ${
      p.name ||
      "Ziya Jewellery Product"
     }

Metal: ${
      p.metal || ""
     }

Purity: ${
      p.purity || ""
     }

Price: ₹${
      offer
      ?
      sale
      :
      p.price || ""
     }

${
      offer
      ?
      discount +
      "% OFF"
      :
      ""
     }

Ziya Jewellery`
    );


    div.innerHTML = `

     ${imageHTML}

     <strong>
      ${escapeHTML(
       p.name ||
       "Product"
      )}
     </strong>

     <br>

     <small>

      ${escapeHTML(
       p.metal || ""
      )}

      •
      
      ${escapeHTML(
       p.purity || ""
      )}

     </small>

     <br>

     <small>

      Category:
      ${escapeHTML(
       p.category || ""
      )}

     </small>

     <br>

     <small>

      Price:
      ₹${Number(
       p.price || 0
      ).toLocaleString(
       "en-IN"
      )}

     </small>

     ${
      offer
      ?
      `
       <br>
       <small>
        🏷️ ${discount}% OFF
        →
        ₹${sale.toLocaleString(
         "en-IN"
        )}
       </small>
      `
      :
      ""
     }

     <br>

     <a
      class="share"
      target="_blank"
      href="https://wa.me/?text=${shareText}"
     >
      📲 Share on WhatsApp
     </a>

     <br>

     <button
      class="delete"
      data-id="${item.id}"
     >
      🗑️ Delete
     </button>

    `;


    div
    .querySelector(
     ".delete"
    )
    .addEventListener(
     "click",
     async()=>{

      if(
       confirm(
        "Delete this product?"
       )
      ){

       await deleteDoc(
        doc(
         db,
         "products",
         item.id
        )
       );

       loadProducts();

      }

     }
    );


    products.appendChild(
     div
    );

   }
  );

 }
 catch(error){

  console.error(error);

  products.innerHTML =
  "<p class='empty'>Unable to load products: " +
  escapeHTML(
   error.message
  ) +
  "</p>";

 }

}


/* ORDER STATUS */

async function setOrderStatus(
 orderId,
 newStatus
){

 try{

  await updateDoc(
   doc(
    db,
    "orders",
    orderId
   ),
   {

    orderStatus:
     newStatus,

    updatedAt:
     serverTimestamp()

   }
  );


  loadOrders();

 }
 catch(error){

  console.error(error);

  alert(
   "Status update failed: " +
   error.message
  );

 }

}


/* CANCEL ORDER */

async function cancelOrder(
 orderId
){

 const reason =
 prompt(
  "Cancel reason:",
  "Customer requested"
 );


 if(reason === null){
  return;
 }


 try{

  await updateDoc(
   doc(
    db,
    "orders",
    orderId
   ),
   {

    orderStatus:
     "Cancelled",

    cancelReason:
     reason.trim() ||
     "Not specified",

    cancelledAt:
     serverTimestamp(),

    updatedAt:
     serverTimestamp()

   }
  );


  loadOrders();

 }
 catch(error){

  console.error(error);

  alert(
   "Order cancellation failed: " +
   error.message
  );

 }

}


/* ORDER ITEM HTML */

function renderOrderItems(
 items
){

 if(
  !Array.isArray(items) ||
  !items.length
 ){

  return `
   <p>
    No item details available.
   </p>
  `;

 }


 return items
 .map(
  item=>{

   const image =
   item.image ||
   (
    Array.isArray(
     item.images
    )
    ?
    item.images[0]
    :
    ""
   );


   const qty =
   Number(
    item.quantity || 1
   );


   const price =
   Number(
    item.price || 0
   );


   return `

    <div class="order-item">

     ${
      image
      ?
      `<img
       src="${escapeHTML(image)}"
       alt="Product"
      >`
      :
      `<div
       style="
        width:70px;
        height:70px;
        border-radius:10px;
        background:#f7edf5;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:35px;
       "
      >
       💎
      </div>`
     }

     <div class="order-item-info">

      <strong>
       ${escapeHTML(
        item.name ||
        "Jewellery"
       )}
      </strong>

      <br>

      <small>
       Qty:
       ${qty}
      </small>

      <br>

      <small>
       Price:
       ₹${price.toLocaleString(
        "en-IN"
       )}
      </small>

      ${
       item.discountPercent
       ?
       `
        <br>
        <small>
         🏷️
         ${Number(
          item.discountPercent
         )}% OFF
        </small>
       `
       :
       ""
      }

     </div>

    </div>

   `;

  }
 )
 .join("");

}


/* LOAD ORDERS */

async function loadOrders(){

 try{

  const snap =
  await getDocs(
   collection(
    db,
    "orders"
   )
  );


  if(snap.empty){

   orders.innerHTML =
   "<p class='empty'>No customer orders yet.</p>";

   return;

  }


  orders.innerHTML = "";


  snap.forEach(
   item=>{

    const o =
    item.data();


    const div =
    document.createElement(
     "div"
    );

    div.className =
    "order";


    const customer =
    o.customerName ||
    (
     o.customer &&
     o.customer.name
    ) ||
    "Not available";


    const phone =
    o.phone ||
    (
     o.customer &&
     o.customer.phone
    ) ||
    "";


    const address =
    o.address ||
    (
     o.customer &&
     o.customer.address
    ) ||
    "";


    const city =
    o.city ||
    "";


    const state =
    o.state ||
    "";


    const pincode =
    o.pincode ||
    "";


    const payment =
    o.payment ||
    o.paymentMethod ||
    o.paymentStatus ||
    "Pending";


    const orderStatus =
    o.orderStatus ||
    o.status ||
    "New Order";


    const total =
    Number(
     o.total || 0
    );


    const items =
    o.items ||
    o.products ||
    [];


    const attachment =
    o.attachmentUrl ||
    o.customerAttachment ||
    o.attachment ||
    "";


    const cancelReason =
    o.cancelReason ||
    "";


    div.innerHTML = `

     <div class="order-title">

      🆔 Order ID:
      ${escapeHTML(
       item.id
      )}

     </div>


     <div class="order-row">

      👤
      <strong>
       Customer:
      </strong>

      ${escapeHTML(
       customer
      )}

     </div>


     ${
      phone
      ?
      `
       <div class="order-row">

        📱
        <strong>
         Mobile:
        </strong>

        ${escapeHTML(
         phone
        )}

       </div>
      `
      :
      ""
     }


     ${
      address
      ?
      `
       <div class="order-row">

        📍
        <strong>
         Address:
        </strong>

        ${escapeHTML(
         address
        )}

        ${
         city ||
         state ||
         pincode
         ?
         `<br>
          ${escapeHTML(city)}
          ${city && state ? ", " : ""}
          ${escapeHTML(state)}
          ${
           pincode
           ?
           " - " +
           escapeHTML(
            pincode
           )
           :
           ""
          }`
         :
         ""
        }

       </div>
      `
      :
      ""
     }


     <div class="order-row">

      💳
      <strong>
       Payment:
      </strong>

      <br>

      <span class="payment-badge">

       ${escapeHTML(
        payment
       )}

      </span>

     </div>


     <div class="order-row">

      📦
      <strong>
       Order Status:
      </strong>

      <br>

      <span class="${
       orderStatus ===
       "Cancelled"
       ?
       "cancel-badge"
       :
       "status-badge"
      }">

       ${escapeHTML(
        orderStatus
       )}

      </span>

     </div>


     ${
      cancelReason
      ?
      `
       <div class="order-row">

        ❌
        <strong>
         Cancel Reason:
        </strong>

        ${escapeHTML(
         cancelReason
        )}

       </div>
      `
      :
      ""
     }


     <div class="order-items">

      <strong>
       🛍️ Ordered Items
      </strong>

      ${renderOrderItems(
       items
      )}

     </div>


     <div class="order-row">

      💰
      <strong>
       Total:
      </strong>

      ₹${total.toLocaleString(
       "en-IN"
      )}

     </div>


     ${
      attachment
      ?
      `
       <div class="order-row">

        📎
        <strong>
         Customer Attachment:
        </strong>

        <br>

        <a
         class="attachment"
         href="${escapeHTML(
          attachment
         )}"
         target="_blank"
         rel="noopener"
        >
         🖼️ View Attachment
        </a>

       </div>
      `
      :
      ""
     }


     <div class="order-actions">

      <button
       class="statusBtn"
       data-status="Confirmed"
      >
       ✅ Confirm
      </button>

      <button
       class="statusBtn"
       data-status="Processing"
      >
       ⚙️ Processing
      </button>

      <button
       class="statusBtn"
       data-status="Shipped"
      >
       🚚 Shipped
      </button>

      <button
       class="statusBtn"
       data-status="Delivered"
      >
       📦 Delivered
      </button>

      ${
       orderStatus !==
       "Cancelled"
       ?
       `
        <button
         class="cancelBtn"
        >
         ❌ Cancel Order
        </button>
       `
       :
       ""
      }

     </div>

    `;


    div
    .querySelectorAll(
     "[data-status]"
    )
    .forEach(
     button=>{

      button.addEventListener(
       "click",
       ()=>{

        setOrderStatus(
         item.id,
         button.dataset.status
        );

       }
      );

     }
    );


    const cancelButton =
    div.querySelector(
     ".cancelBtn"
    );


    if(cancelButton){

     cancelButton.addEventListener(
      "click",
      ()=>{

       cancelOrder(
        item.id
       );

      }
     );

    }


    orders.appendChild(
     div
    );

   }
  );

 }
 catch(error){

  console.error(error);

  orders.innerHTML =
  "<p class='empty'>Unable to load orders: " +
  escapeHTML(
   error.message
  ) +
  "</p>";

 }

}


</script>

</body>
</html>
