<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Ziya Jewellery</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff7fb,#f1eaff);color:#29152e}
header{background:linear-gradient(135deg,#8d1455,#5c1b9e);color:white;padding:17px 20px}
.nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}
.logo{font-size:25px;font-weight:800}.navlinks{display:flex;gap:8px;flex-wrap:wrap}
.navlinks a{color:white;text-decoration:none;padding:9px 12px;border-radius:18px;background:#ffffff1c;font-size:14px}
.container{max-width:1000px;margin:30px auto;padding:0 18px}h1{color:#701650}
.checkout{display:grid;grid-template-columns:1fr 1fr;gap:25px}
.box{background:white;padding:22px;border-radius:20px;box-shadow:0 10px 30px #5a235018}
.box h2{margin-top:0;color:#701650}.product{display:flex;gap:15px;padding:12px 0;border-bottom:1px solid #eee}
.product img{width:80px;height:80px;object-fit:cover;border-radius:12px;background:#f7edf5}
.product-info{flex:1}.product-name{font-weight:bold}.product-price{color:#a01762;font-weight:bold;margin-top:6px}
label{display:block;font-weight:bold;margin-top:14px;margin-bottom:6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}
textarea{min-height:90px;resize:vertical}.voucher-box,.delivery-box{margin-top:18px;padding:15px;border-radius:14px}
.voucher-box{background:#fff5fb;border:1px solid #f0d5e7}.delivery-box{background:#f6f0ff;border:1px solid #e3d6ff}
.voucher-row{display:flex;gap:8px}.apply-voucher{border:0;border-radius:10px;padding:12px 16px;background:#701650;color:white;font-weight:bold;cursor:pointer}
.voucher-message{margin-top:8px;font-size:13px;font-weight:bold}.delivery-date{margin-top:6px;font-size:18px;font-weight:bold;color:#701650}
.row,.discount-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.discount-row{color:#08743d}.total{font-size:24px;font-weight:bold;color:#701650;margin-top:20px}
.place{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#e72b7b,#7025ed);color:white;font-size:16px;font-weight:bold;cursor:pointer}
.empty{background:white;padding:50px 20px;text-align:center;border-radius:20px}.empty a{display:inline-block;margin-top:15px;padding:12px 20px;background:#721550;color:white;text-decoration:none;border-radius:10px}
.message{display:none;margin-top:15px;padding:13px;background:#e8fff0;color:#08743d;border-radius:10px}
@media(max-width:750px){.nav{flex-direction:column}.checkout{grid-template-columns:1fr}.voucher-row{flex-direction:column}}
</style>
</head>
<body>
<header><div class="nav">
<div class="logo">✨ Ziya Jewellery</div>
<div class="navlinks">
<a href="index.html">🏠 Home</a>
<a href="wishlist.html">❤️ Saved</a>
<a href="cart.html">🛒 Cart</a>
<a href="orders.html">📦 Orders</a>
</div></div></header>

<main class="container"><h1>🛍️ Checkout</h1><div id="main"></div></main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getFirestore,collection,getDocs,addDoc,serverTimestamp}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBmapJhIb0QixjcUbLqB1X9l7EuPMqEUEQ",
authDomain:"ziya-jewellery-d420f.firebaseapp.com",
projectId:"ziya-jewellery-d420f",
storageBucket:"ziya-jewellery-d420f.firebasestorage.app",
messagingSenderId:"292032564389",
appId:"1:292032564389:web:69b11699d8f790db5c114c"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

function getCart(){
try{return JSON.parse(localStorage.getItem("ziyaCart"))||[]}
catch{return []}
}
function escapeHTML(value){
return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
.replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function money(value){
return Number(value||0).toLocaleString("en-IN",{maximumFractionDigits:2});
}

let cart=getCart();
let subtotal=0;
let discountAmount=0;
let finalTotal=0;
let appliedVoucher=null;

function calculateTotals(){
subtotal=cart.reduce((sum,item)=>sum+Number(item.price||0)*Number(item.quantity||1),0);
discountAmount=0;

if(appliedVoucher){
const type=String(appliedVoucher.discountType||"percent").toLowerCase();
const value=Number(appliedVoucher.discountValue||0);
if(type==="fixed") discountAmount=Math.min(subtotal,Math.max(0,value));
else discountAmount=subtotal*Math.min(100,Math.max(0,value))/100;
}
finalTotal=Math.max(0,subtotal-discountAmount);
}

async function loadVouchers(){
try{
const snapshot=await getDocs(collection(db,"vouchers"));
return snapshot.docs.map(d=>({id:d.id,...d.data()}));
}catch(error){
console.error("Voucher loading error:",error);
return [];
}
}

async function applyVoucher(){
const input=document.getElementById("voucherCode");
const message=document.getElementById("voucherMessage");
const code=input.value.trim().toUpperCase();

if(!code){
message.style.color="#b00045";
message.textContent="Voucher code enter karein.";
return;
}

message.style.color="#555";
message.textContent="Checking voucher...";

const vouchers=await loadVouchers();
const today=new Date();

const voucher=vouchers.find(v=>{
if(String(v.code||"").trim().toUpperCase()!==code)return false;
if(v.active===false)return false;

if(v.startDate && today<new Date(v.startDate))return false;
if(v.expiryDate && today>new Date(v.expiryDate+"T23:59:59"))return false;

return true;
});

if(!voucher){
appliedVoucher=null;
calculateTotals();
updateTotals();
message.style.color="#b00045";
message.textContent="Invalid ya expired voucher.";
return;
}

appliedVoucher=voucher;
calculateTotals();
updateTotals();
message.style.color="#08743d";
message.textContent="✓ Voucher applied successfully!";
}

function updateTotals(){
const a=document.getElementById("subtotal");
const b=document.getElementById("discountAmount");
const c=document.getElementById("finalTotal");
const d=document.getElementById("finalTotalSide");
if(a)a.textContent="₹"+money(subtotal);
if(b)b.textContent="- ₹"+money(discountAmount);
if(c)c.textContent=money(finalTotal);
if(d)d.textContent=money(finalTotal);
}

async function loadDeliveryDate(){
const box=document.getElementById("deliveryDate");
if(!box)return;

try{
const snapshot=await getDocs(collection(db,"siteSettings"));
let deliveryDate="";

snapshot.forEach(d=>{
const data=d.data()||{};
if(d.id==="site" && data.deliveryDate)deliveryDate=data.deliveryDate;
});

if(deliveryDate){
const date=new Date(deliveryDate+"T00:00:00");
box.textContent="📦 Expected Delivery: "+date.toLocaleDateString("en-IN",{
day:"2-digit",month:"long",year:"numeric"
});
}else{
box.textContent="📦 Delivery date Admin confirmation ke baad show hogi.";
}
}catch(error){
console.error("Delivery date error:",error);
box.textContent="📦 Delivery date Admin confirmation ke baad show hogi.";
}
}

async function render(){
const main=document.getElementById("main");
cart=getCart();

if(!cart.length){
main.innerHTML=`<div class="empty"><div style="font-size:60px">🛒</div>
<h2>Your cart is empty</h2><p>Add a product before checkout.</p>
<a href="index.html">Continue Shopping</a></div>`;
return;
}

calculateTotals();
let productsHTML="";

cart.forEach(item=>{
const quantity=Number(item.quantity||1);
const price=Number(item.price||0);

productsHTML+=`<div class="product">
${item.image?`<img src="${escapeHTML(item.image)}" alt="Jewellery">`
:`<div style="width:80px;height:80px;border-radius:12px;background:#f7edf5;display:flex;align-items:center;justify-content:center;font-size:40px">💎</div>`}
<div class="product-info">
<div class="product-name">${escapeHTML(item.name||"Jewellery")}</div>
<div>Quantity: ${quantity}</div>
<div class="product-price">₹${money(price*quantity)}</div>
</div></div>`;
});

main.innerHTML=`<div class="checkout">
<div class="box">
<h2>📦 Delivery Details</h2>
<form id="orderForm">

<label>Full Name</label>
<input id="customerName" type="text" placeholder="Your name" required>

<label>Mobile Number</label>
<input id="phone" type="tel" placeholder="10 digit mobile number" pattern="[0-9]{10}" required>

<label>Address</label>
<textarea id="address" placeholder="House / Village / Street" required></textarea>

<label>City</label>
<input id="city" type="text" placeholder="City" required>

<label>State</label>
<input id="state" type="text" placeholder="State" required>

<label>PIN Code</label>
<input id="pincode" type="text" placeholder="PIN code" pattern="[0-9]{6}" required>

<label>Payment Method</label>
<select id="payment">
<option value="COD">Cash on Delivery</option>
<option value="UPI">UPI</option>
</select>

<div class="voucher-box">
<strong>🎟️ Voucher / Coupon</strong>
<div class="voucher-row">
<input id="voucherCode" type="text" placeholder="Enter voucher code">
<button type="button" class="apply-voucher" id="applyVoucher">Apply</button>
</div>
<div id="voucherMessage" class="voucher-message"></div>
</div>

<div class="delivery-box">
<strong>🚚 Delivery Information</strong>
<div id="deliveryDate" class="delivery-date">Delivery date checking...</div>
</div>

<div class="row"><span>Subtotal</span><strong id="subtotal">₹0</strong></div>
<div class="discount-row"><span>Voucher Discount</span><strong id="discountAmount">- ₹0</strong></div>

<div class="total">Final Total: ₹<span id="finalTotal">0</span></div>

<button class="place" type="submit">🛍️ Place Order</button>
<div id="message" class="message"></div>
</form>
</div>

<div class="box">
<h2>🛒 Your Order</h2>
${productsHTML}
<div class="total">Final Total: ₹<span id="finalTotalSide">${money(finalTotal)}</span></div>
</div>
</div>`;

document.getElementById("applyVoucher").addEventListener("click",applyVoucher);
document.getElementById("orderForm").addEventListener("submit",placeOrder);
updateTotals();
loadDeliveryDate();
}

async function placeOrder(event){
event.preventDefault();

const customerName=document.getElementById("customerName").value.trim();
const phone=document.getElementById("phone").value.trim();
const address=document.getElementById("address").value.trim();
const city=document.getElementById("city").value.trim();
const state=document.getElementById("state").value.trim();
const pincode=document.getElementById("pincode").value.trim();

if(!/^[0-9]{10}$/.test(phone)){
const message=document.getElementById("message");
message.style.display="block";
message.style.background="#fff0f0";
message.style.color="#b00045";
message.textContent="Please enter a valid 10 digit mobile number.";
return;
}

if(!/^[0-9]{6}$/.test(pincode)){
const message=document.getElementById("message");
message.style.display="block";
message.style.background="#fff0f0";
message.style.color="#b00045";
message.textContent="Please enter a valid 6 digit PIN code.";
return;
}

const orderId="ZY"+Date.now();

const order={
id:orderId,
orderId:orderId,
customerName:customerName,
phone:phone,
mobile:phone,
address:address,
city:city,
state:state,
pincode:pincode,
customer:{
name:customerName,
phone:phone,
address:address,
city:city,
state:state,
pincode:pincode,
pin:pincode
},
payment:document.getElementById("payment").value,
paymentMethod:document.getElementById("payment").value,
paymentStatus:"Pending",
items:cart,
subtotal:subtotal,
voucherCode:appliedVoucher?String(appliedVoucher.code||""):"",
voucherDiscount:discountAmount,
total:finalTotal,
finalTotal:finalTotal,
status:"New Order",
orderStatus:"New Order",
deliveryDate:"",
createdAt:serverTimestamp()
};

try{
await addDoc(collection(db,"orders"),order);
localStorage.removeItem("ziyaCart");

const message=document.getElementById("message");
message.style.display="block";
message.style.background="#e8fff0";
message.style.color="#08743d";
message.textContent="✓ Order placed successfully! Order ID: "+order.orderId;

setTimeout(()=>{window.location.href="orders.html"},1500);
}catch(error){
console.error("Order save error:",error);
const message=document.getElementById("message");
message.style.display="block";
message.style.background="#fff0f0";
message.style.color="#b00045";
message.textContent="Order save failed: "+error.message;
}
}

render();
</script>
</body>
</html>
