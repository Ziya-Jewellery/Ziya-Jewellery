<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saved Jewellery | Ziya Jewellery</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#fff6fb,#f1eaff);
color:#29152e;
}

header{
background:linear-gradient(135deg,#8d1455,#5c1b9e);
color:white;
padding:17px 20px;
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.logo{
font-size:25px;
font-weight:800;
}

.navlinks{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.navlinks a{
color:white;
text-decoration:none;
padding:9px 12px;
border-radius:18px;
background:#ffffff1c;
font-size:14px;
}

.container{
max-width:1100px;
margin:30px auto;
padding:0 18px;
}

h1{
color:#701650;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(230px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 8px 28px #5a235018;
}

.image{
height:230px;
background:#f7edf5;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.image img{
width:100%;
height:100%;
object-fit:cover;
}

.noimage{
font-size:65px;
opacity:.5;
}

.info{
padding:16px;
}

.name{
font-size:18px;
font-weight:bold;
margin-bottom:7px;
}

.meta{
font-size:13px;
color:#777;
line-height:1.6;
}

.price{
font-size:20px;
font-weight:bold;
color:#a01762;
margin:10px 0;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.btn{
border:0;
padding:10px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
text-align:center;
text-decoration:none;
font-size:13px;
}

.view{
background:#eee4f2;
color:#6c1c55;
}

.remove{
background:#fff0f4;
color:#a00045;
}

.empty{
background:white;
border-radius:20px;
padding:60px 20px;
text-align:center;
box-shadow:0 10px 30px #5a235018;
}

.empty-icon{
font-size:70px;
}

.shop{
display:inline-block;
margin-top:15px;
padding:12px 20px;
border-radius:22px;
background:#721550;
color:white;
text-decoration:none;
font-weight:bold;
}

@media(max-width:600px){

.nav{
flex-direction:column;
}

.grid{
grid-template-columns:
repeat(2,minmax(0,1fr));
gap:12px;
}

.image{
height:170px;
}

.info{
padding:11px;
}

.name{
font-size:15px;
}

.price{
font-size:17px;
}

}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
✨ Ziya Jewellery
</div>

<div class="navlinks">

<a href="index.html">
🏠 Home
</a>

<a href="categories.html">
Categories
</a>

<a href="cart.html">
🛒 Cart
</a>

<a href="orders.html">
📦 Orders
</a>

</div>

</div>

</header>


<main class="container">

<h1>❤️ Saved Jewellery</h1>

<div
id="wishlist"
>
Loading saved products...
</div>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyBmapJhIb0QixjcUbLqB1X9l7EuPMqEUEQ",

authDomain:
"ziya-jewellery-d420f.firebaseapp.com",

projectId:
"ziya-jewellery-d420f",

storageBucket:
"ziya-jewellery-d420f.firebasestorage.app",

messagingSenderId:
"292032564389",

appId:
"1:292032564389:web:69b11699d8f790db5c114c"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


const box=
document.getElementById(
"wishlist"
);


function getSaved(){

try{

return JSON.parse(
localStorage.getItem(
"ziyaWishlist"
)
)||[];

}
catch{

return[];

}

}


function saveSaved(list){

localStorage.setItem(
"ziyaWishlist",
JSON.stringify(list)
);

}


function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* LOAD */

async function loadWishlist(){

const ids=
getSaved();


if(!ids.length){

showEmpty();

return;

}


box.innerHTML=`

<div class="grid" id="grid"></div>

`;

const grid=
document.getElementById(
"grid"
);


for(
const id of ids
){

try{

const snap=
await getDoc(
doc(
db,
"products",
id
)
);


if(!snap.exists()){

continue;

}


const p={
id:snap.id,
...snap.data()
};


const card=
document.createElement(
"div"
);

card.className="card";


const image=
p.image
?
`
<img
src="${escapeHTML(p.image)}"
alt="${escapeHTML(p.name||"Jewellery")}"
onerror="
this.style.display='none';
this.nextElementSibling.style.display='block';
"
>

<div
class="noimage"
style="display:none"
>
💎
</div>
`
:
`
<div class="noimage">
💎
</div>
`;


card.innerHTML=`

<div class="image">

${image}

</div>


<div class="info">

<div class="name">

${escapeHTML(
p.name||"Jewellery Product"
)}

</div>


<div class="meta">

${p.metal
?
"Metal: "+
escapeHTML(p.metal)+"<br>"
:""}

${p.purity
?
"Purity: "+
escapeHTML(p.purity)+"<br>"
:""}

${p.category
?
"Category: "+
escapeHTML(p.category)
:""}

</div>


<div class="price">

₹${Number(
p.price||0
).toLocaleString(
"en-IN"
)}

</div>


<div class="buttons">

<a
class="btn view"
href="product.html?id=${encodeURIComponent(p.id)}"
>
View Product
</a>

<button
class="btn remove"
data-id="${escapeHTML(p.id)}"
>
Remove ❤️
</button>

</div>

</div>

`;


grid.appendChild(card);

}
catch(error){

console.error(error);

}

}


/* EMPTY AFTER REMOVED PRODUCTS */

if(!grid.children.length){

showEmpty();

}

}


/* REMOVE */

document.addEventListener(
"click",
event=>{

const button=
event.target.closest(
"[data-id]"
);

if(!button)return;


const id=
button.dataset.id;


let saved=
getSaved();


saved=
saved.filter(
item=>item!==id
);


saveSaved(saved);

loadWishlist();

});


function showEmpty(){

box.innerHTML=`

<div class="empty">

<div class="empty-icon">
❤️
</div>

<h2>
No saved jewellery yet
</h2>

<p>
Tap ❤️ Save on any jewellery product
to keep it here.
</p>

<a
class="shop"
href="index.html"
>
Explore Jewellery
</a>

</div>

`;

}


loadWishlist();

</script>

</body>
</html>
