<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Ziya Jewellery</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:linear-gradient(135deg,#fff5fa,#f1eaff);
 color:#29152e;
}

header{
 background:linear-gradient(135deg,#8d1455,#5c1b9e);
 color:white;
 padding:18px;
}

.header{
 max-width:1000px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:25px;
 font-weight:bold;
}

.home{
 color:white;
 text-decoration:none;
 background:#ffffff22;
 padding:9px 14px;
 border-radius:20px;
}

.container{
 max-width:1000px;
 margin:30px auto;
 padding:0 18px;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:20px;
}

.card{
 background:white;
 padding:24px;
 border-radius:20px;
 box-shadow:0 10px 35px #5b245018;
}

h2{
 margin-top:0;
 color:#701650;
}

label{
 display:block;
 font-weight:bold;
 margin-top:12px;
}

input,textarea,select{
 width:100%;
 padding:12px;
 margin-top:6px;
 border:1px solid #ddd2df;
 border-radius:10px;
 font-size:15px;
}

textarea{
 min-height:90px;
 resize:vertical;
}

.order-item{
 display:flex;
 gap:12px;
 padding:12px 0;
 border-bottom:1px solid #eee;
}

.order-item img{
 width:75px;
 height:75px;
 object-fit:cover;
 border-radius:10px;
 background:#f5eaf3;
}

.price{
 font-size:20px;
 font-weight:bold;
 color:#a01762;
 margin-top:15px;
}

.total{
 font-size:25px;
 font-weight:bold;
 color:#721550;
 margin-top:20px;
}

.place{
 width:100%;
 margin-top:20px;
 padding:15px;
 border:0;
 border-radius:12px;
 background:linear-gradient(135deg,#e72b7b,#7025ed);
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

.whatsapp{
 display:block;
 text-align:center;
 margin-top:12px;
 padding:12px;
 border-radius:12px;
 background:#e8fff0;
 color:#08743d;
 text-decoration:none;
 font-weight:bold;
}

.message{
 display:none;
 padding:15px;
 margin-bottom:18px;
 border-radius:12px;
}

.success{
 background:#e8fff0;
 color:#08743d;
}

.error{
 background:#fff0f3;
 color:#a00030;
}

#successBox{
 display:none;
 text-align:center;
}

.order-id{
 font-size:22px;
 font-weight:bold;
 color:#721550;
}

@media(max-width:700px){
 .grid{
  grid-template-columns:1fr;
 }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
✨ Ziya Jewellery
</div>

<a href="index.html" class="home">
🏠 Home
</a>

</div>
</header>


<div class="container">

<div id="main">

<h1>Checkout</h1>

<div id="message" class="message"></div>

<div class="grid">

<!-- ADDRESS -->

<div class="card">

<h2>📍 Delivery Address</h2>

<form id="checkoutForm">

<label>Full Name *</label>
<input
id="name"
required
placeholder="Enter your full name"
>

<label>Mobile Number *</label>
<input
id="phone"
required
type="tel"
inputmode="numeric"
pattern="[0-9]{10}"
placeholder="10 digit mobile number"
>

<label>House / Flat No. *</label>
<input
id="house"
required
placeholder="House / Flat number"
>

<label>Street / Area *</label>
<input
id="area"
required
placeholder="Street / Area"
>

<label>City *</label>
<input
id="city"
required
placeholder="City"
>

<label>State *</label>
<input
id="state"
required
placeholder="State"
>

<label>PIN Code *</label>
<input
id="pin"
required
inputmode="numeric"
pattern="[0-9]{6}"
placeholder="6 digit PIN code"
>

<label>Landmark</label>
<input
id="landmark"
placeholder="Nearby landmark"
>

<label>Payment Method</label>

<select id="payment">
<option value="COD">
Cash on Delivery
</option>

<option value="INQUIRY">
Order Inquiry
</option>
</select>

<button
class="place"
type="submit"
>
🛍️ Place Order
</button>

</form>

</div>


<!-- ORDER SUMMARY -->

<div class="card">

<h2>🛒 Order Summary</h2>

<div id="items">
Loading...
</div>

<div class="total">
Total: ₹<span id="total">0</span>
</div>

<a
id="whatsapp"
class="whatsapp"
target="_blank"
href="#"
>
💬 WhatsApp Inquiry
</a>

</div>

</div>

</div>


<!-- SUCCESS -->

<div id="successBox" class="card">

<h2>🎉 Order Received</h2>

<p>
Thank you for choosing Ziya Jewellery.
</p>

<p>Your Order ID:</p>

<div
id="orderId"
class="order-id"
>
</div>

<p>
Please keep this Order ID for future reference.
</p>

<a
href="index.html"
class="home"
style="
display:inline-block;
background:#721550;
"
>
Continue Shopping
</a>

</div>

</div>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={

apiKey:
"AIzaSyBmapJhIb0QixjcUbLqB1X9l7EuPMqEUEQ",

authDomain:
"ziya-jewellery-d420f.firebaseapp.com",

projectId:
"ziya-jewellery-d420f",

storageBucket:
"ziya-jewellery-d420f.firebasestorage.app",

messagingSenderId:
"292032564389",

appId:
"1:292032564389:web:69b11699d8f790db5c114c"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/*
CART

यह checkout page localStorage
से cart पढ़ता है।
*/

let cart=[];

try{

cart=
JSON.parse(
localStorage.getItem(
"ziyaCart"
)
)||[];

}
catch{

cart=[];

}


/* DISPLAY CART */

function displayCart(){

const box=
document.getElementById(
"items"
);

const total=
document.getElementById(
"total"
);


if(!cart.length){

box.innerHTML=`

<p>
Your cart is empty.
</p>

<a href="index.html">
Continue Shopping
</a>

`;

total.textContent="0";

return;

}


box.innerHTML="";

let grandTotal=0;


cart.forEach(item=>{

const price=
Number(item.price)||0;

const quantity=
Number(item.quantity)||1;

grandTotal+=
price*quantity;


const div=
document.createElement(
"div"
);

div.className=
"order-item";


div.innerHTML=`

${
item.image
?
`<img
src="${escapeHTML(item.image)}"
alt=""
>`
:
`<div
style="
width:75px;
height:75px;
display:flex;
align-items:center;
justify-content:center;
background:#f5eaf3;
border-radius:10px;
font-size:35px;
"
>
💎
</div>`
}

<div>

<strong>
${escapeHTML(
item.name||"Jewellery"
)}
</strong>

<br>

<small>
${escapeHTML(
item.metal||""
)}
</small>

<br>

<small>
Qty: ${quantity}
</small>

<br>

<strong>
₹${price*quantity}
</strong>

</div>

`;


box.appendChild(div);

});


total.textContent=
grandTotal.toLocaleString(
"en-IN"
);


createWhatsApp(
grandTotal
);

}


/* WHATSAPP */

function createWhatsApp(total){

const names=
cart
.map(
item=>
`${item.name} x${item.quantity||1}`
)
.join(", ");


const text=
encodeURIComponent(

`Hello Ziya Jewellery,

I want to enquire about:

${names}

Estimated Total: ₹${total}

Please provide more details.`

);


document.getElementById(
"whatsapp"
).href=
`https://wa.me/?text=${text}`;

}


/* FORM */

document
.getElementById(
"checkoutForm"
)
.addEventListener(
"submit",
async event=>{

event.preventDefault();


if(!cart.length){

showMessage(
"Your cart is empty.",
"error"
);

return;

}


const button=
event.target.querySelector(
"button"
);

button.disabled=true;

button.textContent=
"Placing Order...";


try{


/*
GENERATE ORDER ID
*/

const orderId=
"ZJ"+
Date.now()
.toString()
.slice(-8);


/*
CALCULATE TOTAL
*/

let total=0;

cart.forEach(
item=>{

total+=
(Number(item.price)||0)
*
(Number(item.quantity)||1);

});


/*
ORDER DATA
*/

const order={

orderId:orderId,

customer:{

name:
document.getElementById(
"name"
).value.trim(),

phone:
document.getElementById(
"phone"
).value.trim(),

house:
document.getElementById(
"house"
).value.trim(),

area:
document.getElementById(
"area"
).value.trim(),

city:
document.getElementById(
"city"
).value.trim(),

state:
document.getElementById(
"state"
).value.trim(),

pin:
document.getElementById(
"pin"
).value.trim(),

landmark:
document.getElementById(
"landmark"
).value.trim()

},

items:cart,

total:total,

payment:
document.getElementById(
"payment"
).value,

status:"New",

createdAt:
serverTimestamp()

};


/*
SAVE TO FIRESTORE
*/

await addDoc(
collection(
db,
"orders"
),
order
);


/*
CLEAR CART
*/

localStorage.removeItem(
"ziyaCart"
);


/*
SHOW SUCCESS
*/

document.getElementById(
"main"
).style.display="none";


document.getElementById(
"successBox"
).style.display="block";


document.getElementById(
"orderId"
).textContent=
orderId;

}
catch(error){

console.error(error);

showMessage(
"Order could not be placed. Please try again.",
"error"
);

button.disabled=false;

button.textContent=
"🛍️ Place Order";

}

});


/* MESSAGE */

function showMessage(
text,
type
){

const box=
document.getElementById(
"message"
);

box.textContent=text;

box.className=
"message "+type;

box.style.display=
"block";

}


/* SECURITY */

function escapeHTML(value){

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* START */

displayCart();

</script>

</body>
</html>
